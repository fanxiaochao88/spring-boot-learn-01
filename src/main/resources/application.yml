server:
  port: 8089
  shutdown: graceful  # 关闭服务器时等待所有请求处理完毕

spring:
  application:
    name: mall-product
  profiles:
    active: dev
  lifecycle:
    timeout-per-shutdown-phase: 30s # 关闭服务器时等待所有请求处理完毕的超时时间

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false  # 关闭启动banner
    db-config:
      id-type: auto
      logic-delete-field: deleted  # 逻辑删除字段名
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

  info:
    env:
      enabled: true
info:
  app:
    name: mall-product
    version: 1.0.0

mall:
  product:
    page-size-limit: 100 # 每页最大记录数限制
    low-stock-threshold: 10 # 低库存阈值
